<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>周五禁止上线</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#070e1b;color:#e8f5ff;font-family:system-ui,-apple-system,'PingFang SC',sans-serif;height:100%;overscroll-behavior:none}body{display:flex;justify-content:center}button{font:inherit;cursor:pointer;touch-action:manipulation}.app{width:min(100%,900px);height:100dvh;display:flex;flex-direction:column;padding:14px 16px max(12px,env(safe-area-inset-bottom));gap:10px}.title{display:flex;align-items:center;justify-content:space-between}h1{margin:0;font-size:clamp(20px,4vw,30px);letter-spacing:2px;color:#91edff}.sub{font-size:11px;color:#768ca6;letter-spacing:2px}.topbtn{border:1px solid #29440c;background:#142238;color:#c3d2e1;border-radius:8px;padding:8px 10px}.hud{display:grid;grid-template-columns:1fr 1fr 1.5fr;gap:8px}.stat{background:#101e30;border:1px solid #233c53;border-radius:10px;padding:8px 12px}.label{color:#86a0b7;font-size:11px}.value{font-size:25px;font-weight:800;font-variant-numeric:tabular-nums;color:#8ef3dc}.timer{color:#ffb69f}.bar{height:8px;background:#263044;border-radius:6px;margin-top:8px;overflow:hidden}.bar i{display:block;background:#83ed77;height:100%;transition:width .15s}.arena{position:relative;flex:1;min-height:180px;border:1px solid #244058;border-radius:14px;overflow:hidden;background:#0b1829;touch-action:none}canvas{display:block;width:100%;height:100%}.notice{position:absolute;left:12px;right:12px;top:12px;text-align:center;background:#34192b;border:1px solid #f7728a;color:#ffced8;padding:9px;border-radius:8px;font-size:13px;pointer-events:none;display:none}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:#07101be6;backdrop-filter:blur(5px)}.card{max-width:390px;width:100%;text-align:center}.badge{font-size:11px;letter-spacing:3px;color:#76e7cd}.card h2{font-size:clamp(26px,6vw,40px);margin:14px 0}.card p{color:#9eb3c9;line-height:1.7;font-size:14px}.rules{display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:left;margin:20px 0}.rule{padding:10px;background:#152437;border-radius:8px;font-size:13px}.primary{width:100%;border:0;border-radius:10px;padding:14px;background:#91f1cd;color:#092a25;font-weight:800;box-shadow:0 4px 0 #347e6d}.small{font-size:11px!important;color:#6f849b!important}.controls{display:flex;align-items:center;gap:12px}.move{width:82px;height:48px;border-radius:10px;background:#15283f;border:1px solid #355873;color:#a1ecff;font-size:24px;touch-action:none;user-select:none}.hint{flex:1;text-align:center;color:#8aa6bc;font-size:12px}.foot{display:flex;justify-content:space-between;color:#536f86;font-size:10px}.hide{display:none!important}@media(max-height:600px){.app{gap:5px;padding:8px}.title h1{font-size:20px}.stat{padding:4px 10px}.value{font-size:20px}.controls .move{height:36px}.card h2{font-size:24px;margin:8px}.rules{margin:8px}.card p{margin:6px}.foot{display:none}}
.arena.alarm::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:2;animation:alarmPulse 1s infinite;background:radial-gradient(ellipse at center,transparent 35%,rgba(255,25,55,.48));box-shadow:inset 0 0 65px rgba(255,30,45,.55)}.notice{z-index:3}.overlay{z-index:4}@keyframes alarmPulse{0%,100%{opacity:.12}50%{opacity:.9}}@media(prefers-reduced-motion:reduce){.arena.alarm::after{animation:none;opacity:.4}}

</style></head><body><main class="app"><header class="title"><div><div class="sub">FRIDAY · 16:59</div><h1>周五禁止上线<span style="color:#ff8b93">_</span></h1></div><div><button class="topbtn" id="sound" aria-label="切换音乐和音效">音乐：开</button> <button class="topbtn" id="pause">暂停</button></div></header><section class="hud"><div class="stat"><div class="label">处理得分</div><div class="value" id="score">000</div></div><div class="stat"><div class="label">距离下班</div><div class="value timer" id="time">00:40</div></div><div class="stat"><div class="label">服务器稳定性 <span id="health">100%</span></div><div class="bar"><i id="hp" style="width:100%"></i></div><div class="label" id="shield" style="margin-top:5px">护盾：未激活</div></div></section><section class="arena" id="arena"><canvas id="game"></canvas><canvas id="celebration" aria-hidden="true"></canvas><div class="notice" id="notice">⚠ WARNING · 最后 10 秒<br>老板：就改一行，直接上线吧！</div><div class="overlay" id="overlay"><div class="card" id="card"></div></div></section><div class="controls"><button class="move" id="left" aria-label="向左移动">←</button><div class="hint">电脑 ← → / A D<br>手机拖动服务器，或按住方向键</div><button class="move" id="right" aria-label="向右移动">→</button></div><footer class="foot"><span>40 秒守住生产环境</span><span id="best">本机最佳 0</span></footer></main><script>
'use strict';
const $=id=>document.getElementById(id),cv=$('game'),ctx=cv.getContext('2d');let W=600,H=600,dpr=1,state='ready',elapsed=0,score=0,hp=100,shield=0,inv=0,spawn=0,seed=2026,objects=[],effects=[],keys={},player=.5,last=0,audio=null,sound=true,best=0;try{best=Number(localStorage.getItem('friday-best'))||0}catch{}$('best').textContent='本机最佳 '+best;
function resize(){let r=$('arena').getBoundingClientRect();W=r.width;H=r.height;dpr=Math.min(devicePixelRatio||1,2);cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);let c=$('celebration');c.width=W*dpr;c.height=H*dpr;c.getContext('2d').setTransform(dpr,0,0,dpr,0,0)}new ResizeObserver(resize).observe($('arena'));
function rand(){seed=(seed*1664025+1013904223)>>>0;return seed/4294967296}
function audioReady(){if(!sound)return null;try{audio??=new (window.AudioContext||window.webkitAudioContext)();audio.resume();return audio}catch{return null}}
function tone(freq,duration=.12,volume=.025,type='square',at=null){const a=audioReady();if(!a)return;let t=at??a.currentTime,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0002,volume),t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+duration);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+duration+.01);musicNodes.add(o);o.onended=()=>musicNodes.delete(o)}
function beep(f=500){tone(f,.1,.035)}
let musicNodes=new Set(),musicStep=0,nextBeat=0,duckUntil=0,noiseBuffer=null;
function stopMusic(){for(const o of musicNodes){try{o.stop()}catch{}}musicNodes.clear();nextBeat=0}
function drums(at,accent,boss,volume){const a=audioReady();if(!a)return;let o=a.createOscillator(),g=a.createGain();o.frequency.setValueAtTime(boss?130:100,at);o.frequency.exponentialRampToValueAtTime(38,at+.12);g.gain.setValueAtTime(volume*.9,at);g.gain.exponentialRampToValueAtTime(.0001,at+.16);o.connect(g);g.connect(a.destination);o.start(at);o.stop(at+.18);musicNodes.add(o);o.onended=()=>musicNodes.delete(o);if(accent){if(!noiseBuffer){noiseBuffer=a.createBuffer(1,a.sampleRate*.1,a.sampleRate);let data=noiseBuffer.getChannelData(0);let n=99;for(let i=0;i<data.length;i++){n=(n*1664525+1013904223)>>>0;data[i]=(n/4294967296)*2-1}}let src=a.createBufferSource(),f=a.createBiquadFilter(),v=a.createGain();src.buffer=noiseBuffer;f.type='highpass';f.frequency.value=5000;v.gain.setValueAtTime(volume*.25,at);v.gain.exponentialRampToValueAtTime(.0001,at+.07);src.connect(f);f.connect(v);v.connect(a.destination);src.start(at);musicNodes.add(src);src.onended=()=>musicNodes.delete(src)}}
function music(){if(state!=='playing'||!sound)return;let a=audioReady();if(!a)return;const boss=elapsed>=30,interval=60/(boss?156:130)/2; if(!nextBeat||nextBeat<a.currentTime-.2)nextBeat=a.currentTime;let count=0;while(nextBeat<a.currentTime+.09&&count++<4){let i=musicStep%32,v=a.currentTime<duckUntil?.006:.026;const lead=[76,79,83,79,74,78,81,78,72,76,79,76,74,78,81,83,76,79,83,86,83,79,78,74,72,76,79,83,81,78,74,71];const roots=[40,36,43,38];let note=lead[i]+(boss?-12:0);tone(440*Math.pow(2,(note-69)/12),interval*.7,v,'square',nextBeat);let bass=roots[Math.floor(i/8)]+(i%4===2?12:0);tone(440*Math.pow(2,(bass-69)/12),interval*.85,v*1.35,'triangle',nextBeat);if(i%2===0||boss)drums(nextBeat,i%4===2,boss,v);nextBeat+=interval;musicStep++}}
function ending(won){if(!sound)return;let a=audioReady();if(!a)return;const notes=won?[72,76,79,84]:[64,60,55,48];notes.forEach((n,i)=>tone(440*Math.pow(2,(n-69)/12),.22,.035,'triangle',a.currentTime+i*.14))}

function intro(){$('card').innerHTML='<div class="badge">生存挑战 / 40 SECONDS</div><h2>今天，准时下班。</h2><p>你是最后一个值班程序员。<br>接住请求赚分，避开 Bug，撑到 17:00。</p><div class="rules"><div class="rule">▣ 请求 <span style="color:#91f1cd">+10 分</span></div><div class="rule">🐛 Bug <span style="color:#ff8999">−20 稳定性</span></div><div class="rule">☕ 咖啡 <span style="color:#91f1cd">+20 稳定性</span></div><div class="rule">🛡 护盾 <span style="color:#80daff">抵挡一次</span></div></div><button class="primary" id="start">接管服务器 →</button><p class="small">漏掉请求不扣分 · 发布包伤害 35 · 每局相同掉落序列</p>';$('start').onclick=start}
function start(){elapsed=score=shield=inv=spawn=0;hp=100;seed=2026;objects=[];effects=[];keys={};player=.5;confetti=[];stopMusic();musicStep=0;duckUntil=0;warned=false;alarmTick=-1;$('arena').classList.remove('alarm');state='playing';$('overlay').classList.add('hide');$('notice').style.display='none';$('pause').textContent='暂停';beep(700);updateHUD()}
function updateHUD(){$('score').textContent=String(score).padStart(3,'0');$('time').textContent='00:'+String(Math.max(0,Math.ceil(40-elapsed))).padStart(2,'0');$('health').textContent=hp+'%';$('hp').style.width=hp+'%';$('hp').style.background=hp>50?'#83ed77':hp>25?'#ffc40f':'#ff6e86';$('shield').textContent=shield?'护盾：已激活':'护盾：未激活'}
function finish(){stopMusic();$('arena').classList.remove('alarm');if('speechSynthesis' in window)window.speechSynthesis.cancel();state='over';keys={};const previousBest=best,newRecord=score>previousBest;best=Math.max(best,score);try{localStorage.setItem('friday-best',best)}catch{}$('best').textContent='本机最佳 '+best;$('notice').style.display='none';$('overlay').classList.remove('hide');const won=hp>0;let title,quip,face;if(won){face='😎';if(score>=400){title='下班之神';quip='老板还没打完字，你已经走出公司。'}else if(score>=300){title='下班王者';quip='服务器稳稳在线，你本人准时离线。'}else if(score>=200){title='下班闪电侠';quip='打卡声还没落下，人已经在电梯里了。'}else{title='下班锦鲤';quip='分数可以随缘，下班必须准点。'}}else{face='🥲';if(elapsed<15){title='天选打工人';quip='下班与你擦肩而过，工位与你双向奔赴。'}else if(elapsed<30){title='加班之神';quip='你一出手，今晚的灯就不用关了。'}else{title='下班未遂大师';quip='距离下班只差一步，老板却说再改一版。'}}$('card').innerHTML='<div class="result-face">'+face+'</div><div class="badge">'+(won?'17:00 / 打卡成功':'生产事故 / 加班续杯')+'</div><h2 style="color:'+(won?'#91f1cd':'#ff8999')+'">'+(won?'成功下班！':'今晚又是你')+'</h2>'+(newRecord?'<span class="record">✨ NEW RECORD</span>':'')+'<div class="result-title '+(won?'':'failed')+'"><strong>'+title+'</strong><p>'+quip+'</p></div><div class="result-stats"><div>得分<b>'+score+'</b></div><div>坚持<b>'+elapsed.toFixed(1)+'s</b></div><div>最高分<b>'+best+'</b></div></div><p class="small">'+(won?'周末快乐！消息免打扰已准备就绪。':'咖啡已续上，需求还没完。再挑战一次？')+'</p><button class="primary" id="restart">'+(won?'再秀一次下班操作 ↻':'抢救一下我的周末 ↻')+'</button><p class="small">成绩保存在当前设备 · 比赛可截屏记录</p>';$('restart').onclick=start;if(won)celebrate();else confetti=[];ending(won)}
const fc=$('celebration'),fx=fc.getContext('2d');let confetti=[];
function celebrate(){const colors=['#91f1cd','#7bddff','#ffd17b','#ff8999','#c4a3ff'];confetti=Array.from({length:90},(_,i)=>({x:Math.random()*W,y:-Math.random()*H,vx:(Math.random()-.5)*85,vy:65+Math.random()*105,size:4+Math.random()*5,rotation:Math.random()*6,color:colors[i%colors.length],life:6+Math.random()*2}));}
function drawConfetti(dt){fx.clearRect(0,0,W,H);if(state!=='over')return;for(const c of confetti){c.x+=c.vx*dt;c.y+=c.vy*dt;c.rotation+=dt*2;c.life-=dt;fx.save();fx.globalAlpha=Math.max(0,Math.min(1,c.life));fx.translate(c.x,c.y);fx.rotate(c.rotation);fx.fillStyle=c.color;fx.fillRect(-c.size/2,-c.size/2,c.size,c.size*.5);fx.restore()}confetti=confetti.filter(c=>c.life>0&&c.y<H+20)}

function pause(){if(state==='playing'){state='paused';stopMusic();$('arena').classList.remove('alarm');if('speechSynthesis' in window)window.speechSynthesis.cancel();keys={};$('pause').textContent='继续';$('overlay').classList.remove('hide');$('card').innerHTML='<div class="badge">服务器已托管</div><h2>休息一下</h2><p>倒计时已暂停。</p><button class="primary" id="resume">继续值班 →</button>';$('resume').onclick=pause}else if(state==='paused'){state='playing';$('pause').textContent='暂停';$('overlay').classList.add('hide')}}$('pause').onclick=pause;$('sound').onclick=()=>{sound=!sound;if(!sound)stopMusic();if(!sound&&'speechSynthesis' in window)window.speechSynthesis.cancel();$('sound').textContent='音乐：'+(sound?'开':'关');beep()};document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='playing')pause()});window.addEventListener('blur',()=>{keys={};if(state==='playing')pause()});
window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','a','d','A','D',' '].includes(e.key)){e.preventDefault();keys[e.key.toLowerCase()]=true}if(e.code==='Space'&&!e.repeat)pause()});window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
for(let [id,key] of [['left','arrowleft'],['right','arrowright']]){let b=$(id);b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys[key]=true};b.onpointerup=b.onpointercancel=b.onlostpointercapture=()=>keys[key]=false}
let warned=false,alarmTick=-1;
function warning(){if(!sound)return;const a=audioReady();if(a)duckUntil=a.currentTime+3.2;try{if('speechSynthesis' in window){const voice=new SpeechSynthesisUtterance('Warning. Warning.');voice.lang='en-US';voice.rate=.85;voice.pitch=.65;window.speechSynthesis.cancel();window.speechSynthesis.speak(voice)}beep(220)}catch{}}
let dragging=false;function drag(e){let r=cv.getBoundingClientRect();player=Math.max(.06,Math.min(.94,(e.clientX-r.left)/W))}cv.onpointerdown=e=>{if(state!=='playing')return;dragging=true;cv.setPointerCapture(e.pointerId);drag(e)};cv.onpointermove=e=>{if(dragging&&state==='playing')drag(e)};cv.onpointerup=cv.onpointercancel=()=>dragging=false;
const types={request:{color:'#83ed77',symbol:'▣',label:'+10'},bug:{color:'#ff718a',symbol:'🐛',damage:20},package:{color:'#ff9870',symbol:'⚠',damage:35},coffee:{color:'#ffd17b',symbol:'☕'},shield:{color:'#7bddff',symbol:'🛡'}};
function add(){let r=rand(),kind=r<.46?'request':r<.73?'bug':r<.86?'package':r<.95?'coffee':'shield';objects.push({kind,x:.07+rand()*.86,y:-35,speed:.23+rand()*.14+elapsed*.003})}
function step(dt){elapsed=Math.min(40,elapsed+dt);inv=Math.max(0,inv-dt);if(keys.arrowleft||keys.a)player-=dt*.8;if(keys.arrowright||keys.d)player+=dt*.8;player=Math.max(.06,Math.min(.94,player));spawn-=dt;while(spawn<=0){add();spawn+=elapsed<10?.58:elapsed<30?.38:.23}if(elapsed>=30){$('notice').style.display='block';$('arena').classList.add('alarm');if(!warned){warned=true;warning()}let tick=Math.floor(elapsed-30);if(tick!==alarmTick){alarmTick=tick;if(tick>0)beep(tick%2?280:180)}}let py=H-48;for(let o of objects){o.y+=o.speed*H*dt;let radius=Math.max(16,Math.min(23,W*.040));if(Math.abs(o.x*W-player*W)<radius+19&&Math.abs(o.y-py)<28){let t=types[o.kind],text='';if(t.damage){if(inv<=0){if(shield){shield=0;text='护盾抵挡';beep(300)}else{hp=Math.max(0,hp-t.damage);text='−'+t.damage;beep(100);if(navigator.vibrate)navigator.vibrate(60)}inv=.65}}else if(o.kind==='request'){score+=10;text='+10';beep(650)}else if(o.kind==='coffee'){hp=Math.min(100,hp+20);text='+20 稳定性';beep(800)}else{shield=1;text='护盾就绪';beep(900)}effects.push({x:o.x*W,y:py-30,text,color:t.color,life:1});o.dead=true}if(o.y>H+30)o.dead=true}objects=objects.filter(o=>!o.dead);for(let e of effects){e.y-=dt*38;e.life-=dt}effects=effects.filter(e=>e.life>0);updateHUD();if(hp<=0||elapsed>=40)finish()}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#0b1829';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#163048';ctx.lineWidth=1;for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}ctx.fillStyle='#10243a';for(let x of [5,W-30])for(let y=65;y<H-80;y+=95){ctx.fillRect(x,y,25,70);ctx.fillStyle='#295466';for(let z=0;z<4;z++)ctx.fillRect(x+5,y+8+z*14,14,4);ctx.fillStyle='#10243a'}ctx.fillStyle='#c9983f';for(let x=0;x<W;x+=36)ctx.fillRect(x,H-17,20,4);ctx.textAlign='center';ctx.textBaseline='middle';for(let o of objects){let t=types[o.kind],x=o.x*W,s=Math.max(16,Math.min(23,W*.040));let g=ctx.createLinearGradient(x,o.y-40,x,o.y);g.addColorStop(0,'transparent');g.addColorStop(1,t.color+'55');ctx.fillStyle=g;ctx.fillRect(x-3,o.y-40,6,40);ctx.shadowColor=t.color;ctx.shadowBlur=13;ctx.fillStyle='#102439';ctx.strokeStyle=t.color;ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(x-s,o.y-s,s*2,s*2,7);ctx.fill();ctx.stroke();ctx.shadowBlur=0;ctx.fillStyle=t.color;ctx.font='bold '+(s*1.35)+'px system-ui';ctx.fillText(t.symbol,x,o.y);if(o.kind==='request'){ctx.font='10px system-ui';ctx.fillText('+10',x,o.y+s+10)}}let x=player*W,y=H-48;if(shield){ctx.strokeStyle='#7bddff';ctx.shadowColor='#7bddff';ctx.shadowBlur=16;ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,37,0,Math.PI*2);ctx.stroke();ctx.shadowBlur=0}ctx.globalAlpha=inv>0&&Math.floor(inv*12)%2?.4:1;ctx.fillStyle='#40677e';ctx.strokeStyle='#92d9e8';ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(x-21,y-29,42,58,6);ctx.fill();ctx.stroke();ctx.fillStyle='#071722';ctx.fillRect(x-15,y-22,30,20);ctx.fillStyle='#91f1cd';ctx.fillRect(x-9,y-16,4,5);ctx.fillRect(x+5,y-16,4,5);ctx.fillRect(x-4,y-7,8,2);for(let i=0;i<3;i++){ctx.fillStyle='#0e2939';ctx.fillRect(x-15,y+4+i*7,30,5);ctx.fillStyle='#91f1cd';ctx.fillRect(x+9,y+5+i*7,3,3)}ctx.globalAlpha=1;for(let e of effects){ctx.globalAlpha=Math.min(1,e.life);ctx.fillStyle=e.color;ctx.font='bold 15px system-ui';ctx.fillText(e.text,e.x,e.y)}ctx.globalAlpha=1}
function loop(now){let dt=Math.min((now-last)/1000,.04);last=now;if(state==='playing'){step(dt);music()}draw();drawConfetti(dt);requestAnimationFrame(loop)}intro();requestAnimationFrame(loop);
</script></body></html>
